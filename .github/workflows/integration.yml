name: Integration Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Storage Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -timeout=5m ./oss/...

      - name: Run integration tests
        run: make test-integration

      - name: Collect container diagnostics
        if: always()
        run: |
          docker compose -f compose.integration.yaml ps
          docker compose -f compose.integration.yaml logs --no-color > integration-containers.log 2>&1

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-container-logs
          path: integration-containers.log
          retention-days: 7
          if-no-files-found: warn

      - name: Stop integration services
        if: always()
        run: make integration-down
